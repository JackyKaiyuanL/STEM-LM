[project]
name = "stemlm"
version = "0.1.0"
description = "STEM-LM: masked-species-prediction JSDM"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "h3>=4.0",
    "pyarrow>=14.0",
]

[project.scripts]
stemlm = "stemlm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stemlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "RUF"]
ignore = [
    "E501",    # long help strings / formulas are intentional
    "RUF001",  # intentional math unicode (α, γ, ×, Δ) in help text
]
